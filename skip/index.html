<style>
  /* Layout: a full-bleed lake at golden hour; title top-left, how-to top-right, the skip count big and centred, one soft toolbar bottom-centre. */
  :root{
    --ink:#2b2622;
    --soft:#5b4f47;
    --chip:#fbf7f1;
    --line:#2b262226;
    --hot:#d9506a;
    --grot:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;
    --mono:"Geist Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:#e9c7a6}
  body{font-family:var(--grot);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  #aim{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:3}

  header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));pointer-events:none}
  header a{pointer-events:auto;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
  .title h1{margin:10px 0 0;font-weight:400;line-height:1}
  .title .script{display:block;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;font-variation-settings:"opsz" 144,"SOFT" 100,"WONK" 1;font-size:clamp(40px,4.4vw,68px);letter-spacing:.01em}
  .title .sub{display:block;font-family:"Homemade Apple","Snell Roundhand",cursive;font-size:clamp(12px,1vw,15px);color:var(--soft);margin-top:6px;transform:rotate(-2deg);transform-origin:left}
  .how{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--soft);text-align:right}
  .how b{font-weight:500;color:var(--ink)}

  #count{position:fixed;left:50%;top:15%;transform:translate(-50%,0) scale(1);z-index:4;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;font-variation-settings:"opsz" 144,"SOFT" 100,"WONK" 1;font-size:clamp(70px,10vw,150px);line-height:1;color:#fffaf2;text-shadow:0 4px 30px #6b3b2a55;pointer-events:none;opacity:0;transition:opacity .3s}
  #count.on{opacity:1}
  #count.bump{animation:bump .28s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bump{0%{transform:translate(-50%,0) scale(.7)}100%{transform:translate(-50%,0) scale(1)}}
  #result{position:fixed;left:50%;top:calc(15% + clamp(80px,11vw,165px));transform:translateX(-50%);z-index:4;font:500 14px var(--mono);letter-spacing:.06em;color:#fffaf2;text-shadow:0 2px 14px #6b3b2a88;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
  #result.on{opacity:1}
  #hint{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 74px);transform:translateX(-50%);z-index:4;font:500 13px var(--mono);color:#fffaf2;background:#2b262266;padding:8px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}

  .bar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);background:#fbf7f1e0;border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 10px 30px -18px #2b262280;backdrop-filter:blur(10px)}
  .bar button{font:500 12.5px/1 var(--grot);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 11px;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:#2b26220f}
  .bar button[aria-pressed="true"]{background:var(--ink);color:var(--chip)}
  .bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
  .grp{display:flex;gap:4px;align-items:center}
  .grp .k{font:11px var(--mono);color:var(--soft);padding:0 2px}
  #tilt{width:110px;accent-color:var(--ink)}
  #tiltv{font:500 12px var(--mono);min-width:3.2em}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 58px);z-index:6;font:500 13px var(--grot);background:var(--ink);color:var(--chip);padding:8px 15px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 24px);text-align:center}
  #toast.on{opacity:1}
  #toast b{color:#f3c38f;font-weight:600}

  body.thumb header,body.thumb .bar,body.thumb #toast,body.thumb #hint,body.thumb #result{display:none}
  @media (max-width:860px){
    .how{display:none}
    .title h1{margin-top:6px}
    .title .script{font-size:34px}
    .title .sub{font-size:11px}
    .bar{bottom:10px;border-radius:20px;gap:2px;padding:5px}
    .bar button{padding:7px 8px;font-size:12px}
    .sep{display:none}
    #toast{bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 104px);border-radius:16px}
    #hint{bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 104px)}
    #count{top:20%}
    #result{top:calc(20% + 84px)}
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<canvas id="c" aria-label="A lake at golden hour, seen from the shore. Flick upward to throw a stone. Arrow keys aim, hold and release space to throw."></canvas>
<svg id="aim" aria-hidden="true"></svg>

<header>
  <div>
    <a href="../">&larr; Haptastic</a>
    <div class="title"><h1><span class="script">Skip</span><span class="sub">a stone, a lake, a flick of the wrist</span></h1></div>
  </div>
  <ul class="how">
    <li><b>flick up</b> to throw · <b>faster</b> = farther</li>
    <li>flick a little left or right to aim</li>
    <li>tilt the stone nose-up about <b>20°</b> for the most skips</li>
    <li>keys: <b>← →</b> aim · hold <b>space</b>, let go to throw</li>
  </ul>
</header>

<div id="count" aria-live="polite">0</div>
<div id="result" aria-live="polite"></div>
<div id="hint">flick up to throw</div>
<div id="toast" aria-live="polite"></div>

<nav class="bar" aria-label="Stone controls">
  <div class="grp"><span class="k">tilt</span><input id="tilt" type="range" min="0" max="45" step="1" value="20" aria-label="Stone tilt, degrees"><span id="tiltv">20°</span></div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="Stone">
    <button data-stone="flat" aria-pressed="true">flat stone</button>
    <button data-stone="round" aria-pressed="false">round pebble</button>
  </div>
  <span class="sep"></span>
  <button id="follow" aria-pressed="true" title="Camera follows the stone">follow</button>
  <button id="amb" aria-pressed="true" title="Lake sounds">lake sounds</button>
  <button id="snd" aria-pressed="true">sound</button>
</nav>

<script type="module">
import * as THREE from 'three';

const THUMB = new URLSearchParams(location.search).has('thumb');
if (THUMB) document.body.classList.add('thumb');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const G = 9.81;

/* ---------------- renderer ---------------- */
const cv = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: THUMB });
renderer.setPixelRatio(Math.min(1.75, devicePixelRatio || 1));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, .05, 4000);
const SUN = new THREE.Vector3(-.36, .13, -1).normalize();   // low sun, ahead and to the left

/* the sky, used by the sky dome, the water's reflections and the haze on the hills */
const SKY = `
uniform vec3 uSun;
vec3 skyCol(vec3 d){
  float y = clamp(d.y, -0.2, 1.0);
  vec3 zen = vec3(0.13, 0.25, 0.50), mid = vec3(0.58, 0.40, 0.40), hor = vec3(0.98, 0.52, 0.26);
  vec3 c = mix(hor, mid, smoothstep(0.0, 0.12, y));
  c = mix(c, zen, smoothstep(0.08, 0.7, y));
  float s = max(dot(d, uSun), 0.0);
  c += vec3(1.0, 0.55, 0.25) * pow(s, 5.0) * 0.45 + vec3(1.0, 0.75, 0.45) * pow(s, 80.0) * 0.9;
  c += vec3(1.0, 0.92, 0.75) * smoothstep(0.99978, 0.99990, s) * 14.0;   // the sun's disc
  return c;
}`;
const TAIL = `
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
`;

/* sky dome */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { uSun: { value: SUN } },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: SKY + `varying vec3 vD; void main(){ vec3 col = skyCol(normalize(vD)); ` + TAIL + `}`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 24), skyMat); sky.frustumCulled = false; scene.add(sky);

/* far hills: three layered ridgelines, hazier the farther they are */
function hills(dist, height, seed, haze, tint){
  const N = 260, W = 6000, pos = [], idx = [];
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const ph = [rnd() * 9, rnd() * 9, rnd() * 9, rnd() * 9];
  for (let i = 0; i <= N; i++){
    const x = -W / 2 + W * i / N, u = x / 300;
    let y = height * (.55 + .3 * Math.sin(u * .7 + ph[0]) + .18 * Math.sin(u * 1.9 + ph[1]) + .08 * Math.sin(u * 5.3 + ph[2]) + .04 * Math.sin(u * 13 + ph[3]));
    y += height * .04 * (rnd() - .5);
    pos.push(x, -2, -dist, x, y, -dist);
    if (i < N){ const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.ShaderMaterial({ uniforms: { uSun: { value: SUN }, uHaze: { value: haze }, uTint: { value: new THREE.Color(tint) } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: SKY + `uniform float uHaze; uniform vec3 uTint; varying vec3 vW;
      void main(){ vec3 d = normalize(vW - cameraPosition); vec3 h = skyCol(vec3(d.x, 0.015, d.z));
        float lift = clamp(vW.y / 60.0, 0.0, 1.0);
        vec3 col = mix(uTint, h, uHaze + (1.0 - uHaze) * 0.25 * (1.0 - lift)); ` + TAIL + `}` });
  const mesh = new THREE.Mesh(g, m); scene.add(mesh); return mesh;
}
hills(1700, 120, 7, .7, 0x5a4a6a);
hills(1100, 75, 19, .5, 0x3b3550);
hills(650, 34, 31, .28, 0x1f2a2c);

/* ---------------- the water ----------------
   A shader on one big plane: layered little waves (with the long, slow ones under the short, quick ones),
   the sky reflected more strongly at grazing angles (Fresnel), a glittering path under the sun, shallows
   over the sand at the shore, and expanding rings wherever something touches the water. */
const MAXR = 40;
const ripples = []; for (let i = 0; i < MAXR; i++) ripples.push(new THREE.Vector4(0, 0, -99, 0));
let ripI = 0;
function ripple(x, z, amp, t){ const r = ripples[ripI++ % MAXR]; r.set(x, z, t, amp); }
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN }, uTime: { value: 0 }, uRip: { value: ripples } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: SKY + `
    uniform float uTime; uniform vec4 uRip[${MAXR}]; varying vec3 vW;
    vec2 waves(vec2 p, float lod){
      vec2 g = vec2(0.0);
      for (int i = 0; i < 13; i++){
        float fi = float(i);
        float ang = fi * 2.3999 + 0.4;
        vec2 dir = vec2(cos(ang), sin(ang));
        float k = 0.9 * pow(1.38, fi);            // wavenumber: from ~7 m swells down to ~15 cm ripples
        float a = 0.05 / k;                       // smaller waves, smaller height
        float w = sqrt(9.81 * k);
        float fade = 1.0 - smoothstep(0.0, 1.0, lod * k * 0.0045);  // drop the tiny ones only far away
        g += a * k * cos(dot(dir, p) * k - w * uTime + fi * 1.7) * dir * fade;
      }
      return g;
    }
    void main(){
      vec2 p = vW.xz;
      float dist = length(cameraPosition - vW);
      vec2 g = waves(p, dist);
      // rings spreading from every touch
      for (int i = 0; i < ${MAXR}; i++){
        vec4 R = uRip[i];
        float tau = uTime - R.z;
        if (tau < 0.0 || tau > 7.0 || R.w <= 0.0) continue;
        vec2 dv = p - R.xy; float r = length(dv);
        if (r > 0.3 + 1.1 * tau + 1.0) continue;
        vec2 dir = r > 1e-3 ? dv / r : vec2(0.0);
        float amp = R.w * exp(-tau * 0.55) / (1.0 + r * 0.8);
        for (int j = 0; j < 3; j++){
          float front = (0.25 + 1.0 * tau) * (1.0 - float(j) * 0.28);
          float x = r - front;
          float env = exp(-x * x / (0.04 + 0.05 * tau));
          g += amp * env * cos(x * 16.0) * 16.0 * 0.02 * dir;
        }
      }
      vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
      vec3 v = normalize(cameraPosition - vW);
      vec3 r = reflect(-v, n); r.y = abs(r.y);
      float F = 0.02 + 0.98 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
      vec3 refl = skyCol(r);
      float glint = pow(max(dot(r, uSun), 0.0), 700.0) * 30.0;
      vec3 deep = vec3(0.018, 0.065, 0.085);
      vec3 col = mix(deep, refl, F) + vec3(1.0, 0.85, 0.6) * glint;
      // shallows over sand near the shore, with a thin wet line
      float sh = smoothstep(-0.6, -4.5, vW.z + 0.15 * sin(vW.x * 1.3 + uTime * 0.8));
      vec3 sand = vec3(0.52, 0.42, 0.32) * (0.9 + 0.1 * sin(p.x * 9.0) * sin(p.y * 7.0));
      col = mix(mix(sand * 0.8, col, 0.35 + 0.4 * F), col, sh);
      float edge = smoothstep(0.12, 0.0, abs(vW.z + 0.62 + 0.06 * sin(vW.x * 2.1 + uTime * 1.3)));
      col += vec3(0.9, 0.85, 0.8) * edge * 0.25;
      // haze toward the horizon
      float fog = 1.0 - exp(-dist * 0.0016);
      col = mix(col, skyCol(vec3(-v.x, 0.01, -v.z)), fog * 0.85);
      float alpha = smoothstep(-0.42, -2.6, vW.z + 0.12 * sin(vW.x * 1.7 + uTime));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      gl_FragColor.a = max(alpha, edge * 0.8);
  }`
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000, 1, 1), waterMat);
waterMat.transparent = true; waterMat.depthWrite = false;
water.rotation.x = -Math.PI / 2; water.position.z = -2500 + -0.4; scene.add(water);
const shoreEdge = -0.4;

/* ---------------- shore: sand and pebbles at your feet ---------------- */
const hemi = new THREE.HemisphereLight(0xffd9b8, 0x5a4a3c, 1.1); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xffc896, 2.6); sunL.position.copy(SUN).multiplyScalar(50); scene.add(sunL);
function sandTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#c4a988'; x.fillRect(0, 0, 512, 512);
  let s = 3; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26000; i++){ const v = rnd(); x.fillStyle = v < .5 ? `rgba(60,40,25,${rnd() * .25})` : `rgba(255,235,210,${rnd() * .22})`; x.fillRect(rnd() * 512, rnd() * 512, 1 + rnd() * 1.6, 1 + rnd() * 1.6); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 3); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sand = new THREE.Mesh(new THREE.PlaneGeometry(40, 11), new THREE.MeshStandardMaterial({ map: sandTex(), roughness: 1 }));
sand.rotation.x = -Math.PI / 2; sand.position.set(0, -.03, 2.0); scene.add(sand);
{
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const geo = new THREE.IcosahedronGeometry(1, 2);
  for (let i = 0; i < 70; i++){
    const tone = .3 + rnd() * .35;
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(tone * (1 + rnd() * .15), tone * .95, tone * .88), roughness: .75 + rnd() * .2 }));
    const r = .02 + rnd() * .06;
    m.scale.set(r * (1 + rnd()), r * (.35 + rnd() * .3), r * (1 + rnd() * .6));
    m.position.set((rnd() - .5) * 7, m.scale.y * .4, -.3 + rnd() * 3.2);
    m.rotation.y = rnd() * 6; scene.add(m);
  }
}

/* ---------------- the stone ---------------- */
const STONES = {
  flat:  { umin: 2.6, keep: 1,   hop: 1,   sx: .075, sy: .022, sz: .062, color: 0x6f6a66, say: '<b>Flat stone</b>: thin and wide, so the water can push it back up' },
  round: { umin: 11,  keep: .62, hop: 1.6, sx: .045, sy: .04,  sz: .045, color: 0x8a7b6b, say: '<b>Round pebble</b>: it digs in instead of planing. Lucky to get one skip' }
};
let stoneKey = 'flat', tilt = 20, follow = true, soundOn = true, ambOn = true;
const stoneGeo = new THREE.SphereGeometry(1, 32, 16);
const stoneMat = new THREE.MeshStandardMaterial({ color: STONES.flat.color, roughness: .55, metalness: 0 });
const stone = new THREE.Mesh(stoneGeo, stoneMat);
const stoneHolder = new THREE.Group(); stoneHolder.add(stone); scene.add(stoneHolder);
function shapeStone(){ const S = STONES[stoneKey]; stone.scale.set(S.sx, S.sy, S.sz); stoneMat.color.set(S.color); }
shapeStone();
const HAND = new THREE.Vector3(.28, 1.05, .9);
const st = { mode: 'ready', pos: HAND.clone(), vel: new THREE.Vector3(), spin: 0, skips: 0, start: HAND.clone(), sinkT: 0, best: 0, maxD: 0 };
try { st.best = +localStorage.getItem('skip-best') || 0; } catch (_) {}

/* ---------------- splash droplets ---------------- */
const NP = 220;
const pPos = new Float32Array(NP * 3), pVel = new Float32Array(NP * 3), pLife = new Float32Array(NP);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'); const g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })();
const drops = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: .05, map: dotTex, transparent: true, depthWrite: false, color: 0xfff4e8, opacity: .9 }));
drops.frustumCulled = false; scene.add(drops);
let pI = 0;
for (let i = 0; i < NP; i++) pPos[i * 3 + 1] = -99;
function splash(x, z, n, speed, dir){
  for (let k = 0; k < n; k++){
    const i = pI++ % NP, a = Math.random() * Math.PI * 2, sp = speed * (.3 + Math.random() * .7);
    pPos[i * 3] = x; pPos[i * 3 + 1] = .01; pPos[i * 3 + 2] = z;
    pVel[i * 3] = Math.cos(a) * sp * .45 + dir.x * speed * .5; pVel[i * 3 + 1] = sp * (1 + Math.random()); pVel[i * 3 + 2] = Math.sin(a) * sp * .45 + dir.z * speed * .5;
    pLife[i] = .5 + Math.random() * .5;
  }
}

/* ---------------- sound ---------------- */
let actx = null, out = null, noiseBuf = null, ambGain = null;
function ac(){
  if (!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    out = actx.createGain(); out.gain.value = .9; out.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 4, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); let b = 0;
    for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1; b = (b + .02 * w) / 1.02; d[i] = w * .5 + b * 3; }
    // the lake: soft lapping at the shore and a faint breeze
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    ambGain = actx.createGain(); ambGain.gain.value = ambOn ? .05 : 0;
    const lfo = actx.createOscillator(), lfoG = actx.createGain(); lfo.frequency.value = .13; lfoG.gain.value = .03;
    lfo.connect(lfoG); lfoG.connect(ambGain.gain); lfo.start();
    src.connect(lp); lp.connect(ambGain); ambGain.connect(out); src.start();
  }
  if (actx.state === 'suspended') actx.resume();
}
function bubble(t, f0, f1, dur, amp, pan){
  const o = actx.createOscillator(), g = actx.createGain(), p = actx.createStereoPanner ? actx.createStereoPanner() : null;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .003); g.gain.setTargetAtTime(0, t + .004, dur * .5);
  o.connect(g); if (p){ p.pan.value = pan; g.connect(p); p.connect(out); } else g.connect(out);
  o.start(t); o.stop(t + dur * 4 + .05);
}
function hiss(t, hp, dur, amp){
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = hp; f.Q.value = .8;
  g.gain.setValueAtTime(amp, t); g.gain.setTargetAtTime(0, t, dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 3); s.stop(t + dur * 6);
}
function distGain(p){ return 1 / (1 + p.distanceTo(camera.position) * .05); }
function plip(p, U){              // a skip: a quick slap and a tiny rising bubble note
  if (!soundOn || !actx) return;
  const t = actx.currentTime + .005, a = clamp(U / 16, .15, 1) * distGain(p), pan = clamp(p.x / 10, -.8, .8);
  hiss(t, 2600 + Math.random() * 1500, .012, .35 * a);
  bubble(t + .004, 900 + Math.random() * 600, 1700 + Math.random() * 700, .03, .35 * a, pan);
}
function plunk(p){                // the sink: a deep gulp and a splash
  if (!soundOn || !actx) return;
  const t = actx.currentTime + .005, a = distGain(p), pan = clamp(p.x / 10, -.8, .8);
  hiss(t, 900, .05, .45 * a);
  bubble(t, 240, 560, .09, .55 * a, pan);
  bubble(t + .05, 700, 1300, .05, .25 * a, pan);
}

/* ---------------- physics ----------------
   The stone flies like any thrown thing. When it meets the water it skips only if it is moving fast enough
   across the surface and comes in shallow enough; the water pushes back hardest when the stone is tilted
   nose-up about 20°, the angle Clanet, Hersen and Bocquet found best (Nature, 2004). Each skip costs it some
   speed, so the hops get shorter and closer together until it finally sinks. */
const dirH = new THREE.Vector3(0, 0, -1);
function throwStone(U0, yaw){
  ac();
  const elev = THREE.MathUtils.degToRad(6 + Math.random() * 3);
  dirH.set(Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
  st.pos.copy(HAND); st.start.copy(HAND);
  st.vel.copy(dirH).multiplyScalar(U0 * Math.cos(elev)); st.vel.y = U0 * Math.sin(elev);
  st.spin = 28 + Math.random() * 8; st.skips = 0; st.mode = 'fly'; st.maxD = 0;
  setCount(0, false); $('#result').classList.remove('on');
  $('#hint').style.opacity = 0;
  camT = 0;
}
function contact(){
  const S = STONES[stoneKey];
  const U = Math.hypot(st.vel.x, st.vel.z), Vz = -st.vel.y;
  const theta = THREE.MathUtils.radToDeg(Math.atan2(Vz, U));
  const off = tilt - 20;
  const umin = S.umin + .011 * off * off;
  const p = new THREE.Vector3(st.pos.x, 0, st.pos.z);
  if (U < umin || theta > 40 + Math.random() * 6){ sink(p, U); return; }
  const keep = clamp((.885 - .0008 * off * off - .003 * theta) * S.keep * (.965 + Math.random() * .05), .3, .93);
  const U2 = U * keep;
  const slow = U2 < 6 ? .55 : 1;                       // the last little pitter-patter hops
  const up = (.105 + .025 * Math.random()) * U2 * slow * S.hop;
  const wob = (Math.random() - .5) * .06 * (1 + Math.abs(off) / 20);
  const yaw = Math.atan2(st.vel.x, -st.vel.z) + wob;
  st.vel.set(Math.sin(yaw) * U2, up, -Math.cos(yaw) * U2);
  st.pos.y = .001;
  st.skips++; setCount(st.skips, true);
  ripple(p.x, p.z, clamp(U / 14, .25, 1), clock);
  splash(p.x, p.z, 8 + Math.round(U), .9 + U * .06, st.vel.clone().normalize());
  plip(p, U);
  if (COARSE && touched && navigator.vibrate) navigator.vibrate(clamp(Math.round(U * 1.5), 8, 30));
}
function sink(p, U){
  st.mode = 'sink'; st.sinkT = clock; st.sinkAt = p.clone();
  ripple(p.x, p.z, 1.2, clock); ripple(p.x, p.z, .7, clock + .25);
  splash(p.x, p.z, 26, 1.6 + U * .05, new THREE.Vector3(st.vel.x, 0, st.vel.z).normalize().multiplyScalar(.3));
  plunk(p);
  if (COARSE && touched && navigator.vibrate) navigator.vibrate([20, 30, 12]);
  const d = Math.hypot(p.x - st.start.x, p.z - st.start.z);
  const newBest = st.skips > st.best;
  if (newBest){ st.best = st.skips; try { localStorage.setItem('skip-best', st.best); } catch (_) {} }
  const word = st.skips === 1 ? 'skip' : 'skips';
  $('#result').textContent = st.skips ? `${st.skips} ${word} · ${d.toFixed(0)} m${newBest && st.skips > 1 ? ' · new best!' : st.best ? ` · best ${st.best}` : ''}` : (U < 6 ? 'plunk. throw faster' : 'plunk. too steep, or try a flatter tilt');
  $('#result').classList.add('on');
  if (!st.skips) setCount(0, false);
}
function stepStone(dt){
  if (st.mode === 'fly'){
    const n = Math.ceil(dt / (1 / 480)), h = dt / n;
    for (let i = 0; i < n && st.mode === 'fly'; i++){
      st.vel.y -= G * h;
      st.vel.multiplyScalar(1 - .015 * h);
      st.pos.addScaledVector(st.vel, h);
      if (st.pos.y <= 0 && st.vel.y < 0) contact();
    }
    st.maxD = Math.max(st.maxD, Math.hypot(st.pos.x - st.start.x, st.pos.z - st.start.z));
  } else if (st.mode === 'sink'){
    const t = clock - st.sinkT;
    st.pos.copy(st.sinkAt).addScaledVector(dirH, Math.min(.3, t * .4)); st.pos.y = -t * .5;
    if (t > 3.2){ st.mode = 'ready'; st.pos.copy(HAND); $('#hint').style.opacity = 1; }
  }
}

/* ---------------- camera ---------------- */
const shoreCam = { pos: new THREE.Vector3(0, 1.5, 3.6), look: new THREE.Vector3(0, .75, -30) };
const camPos = shoreCam.pos.clone(), camLook = shoreCam.look.clone();
let camT = 0;
function stepCamera(dt){
  let tp = shoreCam.pos, tl = shoreCam.look, k = 2.2;
  if (follow && (st.mode === 'fly' || st.mode === 'sink')){
    const sp = st.mode === 'sink' ? st.sinkAt : st.pos;
    const back = st.mode === 'sink' ? 3.6 : 2.6;
    tp = new THREE.Vector3(sp.x, 0, sp.z).addScaledVector(dirH, -back); tp.y = Math.max(.45, (st.mode === 'sink' ? .9 : .55) + sp.y * .4);
    tl = new THREE.Vector3(sp.x, 0, sp.z).addScaledVector(dirH, 3.5); tl.y = .15;
    k = st.mode === 'sink' ? 1.6 : 3.2;
    camT += dt;
    if (camT < .5) k *= camT / .5 + .2;                 // ease out from the shore
  }
  const a = 1 - Math.exp(-dt * k);
  camPos.lerp(tp, a); camLook.lerp(tl, a);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* ---------------- throwing: flick ---------------- */
const aimSvg = $('#aim');
let touched = false, drag = null;
cv.addEventListener('pointerdown', e => {
  ac(); touched = true;
  if (st.mode === 'fly') return;
  if (st.mode === 'sink'){ st.mode = 'ready'; }
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }] };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const t = performance.now(); drag.hist.push({ x: e.clientX, y: e.clientY, t });
  while (drag.hist.length > 2 && t - drag.hist[0].t > 90) drag.hist.shift();
  drawAim(drag.x0, drag.y0, e.clientX, e.clientY);
});
function release(e){
  if (!drag || e.pointerId !== drag.id) return;
  const h = drag.hist, a = h[0], z = h[h.length - 1], dt = Math.max(8, z.t - a.t);
  const vx = (z.x - a.x) / dt, vy = (z.y - a.y) / dt;      // px per ms
  drag = null; cv.classList.remove('drag'); aimSvg.innerHTML = '';
  if (vy > -.25){ toast('Flick <b>upward</b>, quickly, to throw'); return; }
  const sp = Math.hypot(vx, vy) * (COARSE ? 1.35 : 1);
  const U0 = clamp(3 + sp * 6.2, 3, 26);
  const yaw = clamp(Math.atan2(vx, -vy) * .8, -.6, .6);
  throwStone(U0, yaw);
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', e => { drag = null; aimSvg.innerHTML = ''; cv.classList.remove('drag'); });
function drawAim(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0;
  if (dy > -6){ aimSvg.innerHTML = ''; return; }
  aimSvg.innerHTML = `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#fffaf2" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" opacity=".85"/><circle cx="${x0}" cy="${y0}" r="7" fill="none" stroke="#fffaf2" stroke-width="2" opacity=".85"/>`;
}

/* ---------------- keyboard ---------------- */
let kYaw = 0, charging = null;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'ArrowLeft'){ kYaw = clamp(kYaw - .06, -.5, .5); e.preventDefault(); toast(`aim ${Math.round(THREE.MathUtils.radToDeg(kYaw))}°`); }
  if (e.code === 'ArrowRight'){ kYaw = clamp(kYaw + .06, -.5, .5); e.preventDefault(); toast(`aim ${Math.round(THREE.MathUtils.radToDeg(kYaw))}°`); }
  if (e.code === 'Space'){ e.preventDefault(); if (!charging && st.mode !== 'fly'){ ac(); charging = performance.now(); } }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' && charging){
    const p = .5 - .5 * Math.cos((performance.now() - charging) / 1000 * Math.PI / .8);   // power swings up and down while held
    charging = null; $('#toast').classList.remove('on');
    throwStone(5 + p * 19, kYaw);
  }
});

/* ---------------- toolbar ---------------- */
let toastT = 0;
function toast(html){ const el = $('#toast'); el.innerHTML = html; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3600); }
$('#tilt').addEventListener('input', e => {
  tilt = +e.target.value; $('#tiltv').textContent = tilt + '°';
  toast(Math.abs(tilt - 20) <= 2 ? '<b>20°</b>: the magic angle. The water pushes the stone back up most for the least drag' : tilt < 20 ? 'Flatter than 20°: the stone slaps and loses speed fast' : 'Steeper than 20°: the stone digs in and needs much more speed');
});
document.querySelectorAll('[data-stone]').forEach(b => b.addEventListener('click', () => {
  stoneKey = b.dataset.stone; document.querySelectorAll('[data-stone]').forEach(x => x.setAttribute('aria-pressed', x === b)); shapeStone(); toast(STONES[stoneKey].say);
}));
$('#follow').addEventListener('click', e => { follow = !follow; e.currentTarget.setAttribute('aria-pressed', follow); });
$('#amb').addEventListener('click', e => { ambOn = !ambOn; e.currentTarget.setAttribute('aria-pressed', ambOn); if (ambGain) ambGain.gain.setTargetAtTime(ambOn ? .05 : 0, actx.currentTime, .2); });
$('#snd').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); if (out) out.gain.setTargetAtTime(soundOn ? .9 : 0, actx.currentTime, .05); });
document.querySelectorAll('.bar button, .bar input').forEach(b => b.addEventListener('pointerdown', e => { e.stopPropagation(); ac(); }));

function setCount(n, bump){
  const el = $('#count'); el.textContent = n;
  el.classList.toggle('on', n > 0);
  if (bump){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

/* ---------------- loop ---------------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 68 : 52; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let clock = 0, last = performance.now(), fishT = 3;
const tmpQ = new THREE.Quaternion();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!THUMB) clock += dt;
  waterMat.uniforms.uTime.value = clock;
  stepStone(dt);
  // a fish rises now and then
  fishT -= dt;
  if (fishT < 0 && !RM){ fishT = 4 + Math.random() * 8; ripple((Math.random() - .5) * 60, -12 - Math.random() * 60, .35, clock); }
  // splash droplets
  for (let i = 0; i < NP; i++){
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt; pVel[i * 3 + 1] -= G * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0 || pLife[i] <= 0){ pPos[i * 3 + 1] = -99; pLife[i] = 0; }
  }
  pGeo.attributes.position.needsUpdate = true;
  // the stone: tilted nose-up, spinning flat
  stoneHolder.position.copy(st.mode === 'ready' ? HAND : st.pos);
  stoneHolder.visible = st.mode !== 'ready';
  const yaw = Math.atan2(dirH.x, -dirH.z);
  stoneHolder.rotation.set(0, -yaw, 0);
  stone.rotation.x = THREE.MathUtils.degToRad(tilt);
  if (st.mode === 'fly') stone.rotation.y += st.spin * dt;
  stepCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (THUMB){
  // a frozen moment: the stone mid-run, with rings behind it
  dirH.set(-.05, 0, -1).normalize();
  const xs = [-7, -11, -14.5, -17.3];
  xs.forEach((z, i) => ripple(z * -.05, z, .9 - i * .12, -(3 - i) * .55));
  st.mode = 'fly'; st.pos.set(-.9, .12, -19); st.vel.set(0, 1, -9);
  splash(-.85, -17.3, 18, 1.4, new THREE.Vector3(0, 0, -1));
  for (let i = 0; i < NP; i++) if (pLife[i] > 0){ const t = .12; pPos[i * 3] += pVel[i * 3] * t; pPos[i * 3 + 1] += pVel[i * 3 + 1] * t - .5 * G * t * t; pPos[i * 3 + 2] += pVel[i * 3 + 2] * t; pLife[i] = 99; pVel[i * 3] = pVel[i * 3 + 1] = pVel[i * 3 + 2] = 0; }
  camPos.set(1.1, .75, -13.2); camLook.set(-.8, .1, -21);
  setCount(4, false);
  stepStone = () => {};
  stepCamera = () => { camera.position.copy(camPos); camera.lookAt(camLook); };
}
requestAnimationFrame(frame);
</script>
</body>
</html>
